<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Single Page Apps for GitHub Pages</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be served with HTTP status code 404,
      // to redirect on-the-fly, otherwise it performs a standard redirect.
      // For example:
      // apache: ErrorDocument 404 /404.html
      // nginx: error_page 404 /404.html;
      // caddy: handle_errors { rewrite * /?{http.request.uri.path}?{http.request.uri.query} }
      // Express (Node.js/http-server): res.status(404).sendFile('/404.html')
      // There is no configuration needed.
      var segmentCount = 0,
        l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/portfolio/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
